<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini Canvas Model Discovery & Diagnostics</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="antialiased p-6 md:p-10 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Known Fallback Models in case GET /models is blocked by Canvas
        const FALLBACK_MODELS = [
            { name: 'models/gemini-1.5-flash', displayName: 'Gemini 1.5 Flash', type: 'text', supportedGenerationMethods: ['generateContent'] },
            { name: 'models/gemini-1.5-pro', displayName: 'Gemini 1.5 Pro', type: 'text', supportedGenerationMethods: ['generateContent'] },
            { name: 'models/gemini-3-flash-preview', displayName: 'Gemini 3 Flash Preview', type: 'text', supportedGenerationMethods: ['generateContent'] },
            { name: 'models/imagen-3.0-generate-001', displayName: 'Imagen 3.0', type: 'image', supportedGenerationMethods: ['predict'] },
            { name: 'models/imagen-4.0-generate-001', displayName: 'Imagen 4.0', type: 'image', supportedGenerationMethods: ['predict'] }
        ];

        const App = () => {
            const [status, setStatus] = useState('idle'); // idle, discovering, testing, complete
            const [logs, setLogs] = useState([]);
            const [models, setModels] = useState([]);
            const [testResults, setTestResults] = useState({});
            
            // Filters
            const [filterText, setFilterText] = useState(true);
            const [filterImage, setFilterImage] = useState(false);
            const [filterMusic, setFilterMusic] = useState(false);

            const addLog = (msg, type = 'info') => {
                setLogs(prev => [...prev, { time: new Date().toLocaleTimeString(), msg, type }]);
            };

            const discoverModels = async () => {
                setStatus('discovering');
                setModels([]);
                setTestResults({});
                setLogs([]);
                addLog('Attempting to fetch live model list from Google API...', 'info');

                try {
                    const response = await fetch('https://generativelanguage.googleapis.com/v1beta/models?key=');
                    
                    if (response.ok) {
                        const data = await response.json();
                        addLog(`Success! Found ${data.models.length} models.`, 'success');
                        
                        // Tag types based on name for filtering
                        const taggedModels = data.models.map(m => {
                            let type = 'other';
                            if (m.name.includes('gemini') || m.supportedGenerationMethods.includes('generateContent')) type = 'text';
                            if (m.name.includes('imagen')) type = 'image';
                            if (m.name.includes('music') || m.name.includes('audio')) type = 'music';
                            return { ...m, type };
                        });
                        setModels(taggedModels);
                    } else {
                        throw new Error(`API returned ${response.status}. The Canvas environment likely blocks the GET /models endpoint without an explicit key.`);
                    }
                } catch (err) {
                    addLog(err.message, 'error');
                    addLog('Falling back to hardcoded known model list.', 'warning');
                    setModels(FALLBACK_MODELS);
                }

                setStatus('idle');
            };

            const testTextModel = async (modelName) => {
                try {
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/${modelName}:generateContent?key=`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ contents: [{ parts: [{ text: "Reply with the exact word: ALIVE" }] }] })
                    });
                    
                    if (!response.ok) return { status: 'failed', reason: `HTTP ${response.status}` };
                    const data = await response.json();
                    const text = data?.candidates?.[0]?.content?.parts?.[0]?.text;
                    if (text && text.includes('ALIVE')) return { status: 'passed', reason: 'Responded correctly' };
                    return { status: 'failed', reason: 'Bad response format' };
                } catch (e) {
                    return { status: 'failed', reason: e.message };
                }
            };

            const runTests = async () => {
                setStatus('testing');
                
                const modelsToTest = models.filter(m => {
                    if (m.type === 'text' && filterText) return true;
                    if (m.type === 'image' && filterImage) return true;
                    if (m.type === 'music' && filterMusic) return true;
                    return false;
                });

                if (modelsToTest.length === 0) {
                    addLog('No models selected to test based on current filters.', 'warning');
                    setStatus('complete');
                    return;
                }

                addLog(`Starting test sequence for ${modelsToTest.length} models...`, 'info');

                let newResults = { ...testResults };
                
                for (const model of modelsToTest) {
                    addLog(`Testing ${model.name}...`, 'info');
                    
                    if (model.type === 'text') {
                        const res = await testTextModel(model.name);
                        newResults[model.name] = res;
                        if (res.status === 'passed') addLog(`${model.name} passed!`, 'success');
                        else addLog(`${model.name} failed: ${res.reason}`, 'error');
                    } else {
                        // Skip complex tests for image/music for now to save bandwidth, just mark as untested or ping
                        newResults[model.name] = { status: 'skipped', reason: 'Only text generation is auto-tested currently.' };
                        addLog(`${model.name} skipped (auto-test not implemented for this type).`, 'warning');
                    }
                    
                    setTestResults({ ...newResults });
                }

                addLog('Test sequence complete.', 'success');
                setStatus('complete');
            };

            return (
                <div className="max-w-5xl mx-auto space-y-6">
                    <header className="mb-8">
                        <h1 className="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-sky-400 to-indigo-500">
                            Gemini Canvas Model Diagnostics
                        </h1>
                        <p className="text-slate-400 mt-2">Discover and verify which Google AI models are intercepted and authorized by the Canvas runtime.</p>
                    </header>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-6">
                        {/* Controls Panel */}
                        <div className="glass-panel p-6 rounded-2xl md:col-span-1 space-y-6">
                            
                            <div>
                                <h2 className="text-lg font-semibold mb-3">1. Filter Target Types</h2>
                                <div className="space-y-2">
                                    <label className="flex items-center space-x-3 cursor-pointer">
                                        <input type="checkbox" checked={filterText} onChange={e => setFilterText(e.target.checked)} className="form-checkbox h-5 w-5 text-sky-500 rounded border-slate-600 bg-slate-800 focus:ring-sky-500" />
                                        <span className="text-slate-300">Text Models (gemini)</span>
                                    </label>
                                    <label className="flex items-center space-x-3 cursor-pointer">
                                        <input type="checkbox" checked={filterImage} onChange={e => setFilterImage(e.target.checked)} className="form-checkbox h-5 w-5 text-sky-500 rounded border-slate-600 bg-slate-800 focus:ring-sky-500" />
                                        <span className="text-slate-300">Image Models (imagen)</span>
                                    </label>
                                    <label className="flex items-center space-x-3 cursor-pointer">
                                        <input type="checkbox" checked={filterMusic} onChange={e => setFilterMusic(e.target.checked)} className="form-checkbox h-5 w-5 text-sky-500 rounded border-slate-600 bg-slate-800 focus:ring-sky-500" />
                                        <span className="text-slate-300">Music/Audio Models</span>
                                    </label>
                                </div>
                            </div>

                            <div className="pt-4 border-t border-slate-700">
                                <h2 className="text-lg font-semibold mb-3">2. Execution</h2>
                                <button 
                                    onClick={discoverModels}
                                    disabled={status === 'discovering' || status === 'testing'}
                                    className="w-full mb-3 px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-white rounded-xl font-medium transition-colors disabled:opacity-50"
                                >
                                    Fetch/Load Model List
                                </button>
                                <button 
                                    onClick={runTests}
                                    disabled={models.length === 0 || status === 'discovering' || status === 'testing'}
                                    className="w-full px-4 py-2.5 bg-sky-600 hover:bg-sky-500 text-white rounded-xl font-medium transition-colors disabled:opacity-50"
                                >
                                    {status === 'testing' ? 'Running Tests...' : 'Trigger Selected Models'}
                                </button>
                            </div>
                        </div>

                        {/* Results Panel */}
                        <div className="glass-panel p-6 rounded-2xl md:col-span-2 flex flex-col h-[600px]">
                            <h2 className="text-lg font-semibold mb-4">Diagnostic Logs & Results</h2>
                            
                            <div className="flex-1 overflow-y-auto mb-4 bg-slate-900/50 rounded-xl border border-slate-700 p-4 font-mono text-sm space-y-2">
                                {logs.length === 0 && <div className="text-slate-500 italic">Waiting to begin...</div>}
                                {logs.map((log, i) => (
                                    <div key={i} className="flex gap-3">
                                        <span className="text-slate-500 shrink-0">[{log.time}]</span>
                                        <span className={`
                                            ${log.type === 'error' ? 'text-rose-400' : ''}
                                            ${log.type === 'success' ? 'text-emerald-400' : ''}
                                            ${log.type === 'warning' ? 'text-amber-400' : ''}
                                            ${log.type === 'info' ? 'text-sky-300' : ''}
                                        `}>{log.msg}</span>
                                    </div>
                                ))}
                            </div>

                            <div className="h-1/2 overflow-y-auto bg-slate-800 rounded-xl border border-slate-700">
                                <table className="w-full text-left text-sm">
                                    <thead className="bg-slate-900/80 sticky top-0">
                                        <tr>
                                            <th className="p-3 font-semibold text-slate-300">Model Name</th>
                                            <th className="p-3 font-semibold text-slate-300 w-24">Type</th>
                                            <th className="p-3 font-semibold text-slate-300 w-32">Test Status</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-slate-700">
                                        {models.length === 0 && (
                                            <tr><td colSpan="3" className="p-4 text-center text-slate-500">No models loaded. Click 'Fetch/Load Model List'.</td></tr>
                                        )}
                                        {models.map(m => {
                                            const isFilteredIn = (m.type === 'text' && filterText) || (m.type === 'image' && filterImage) || (m.type === 'music' && filterMusic);
                                            if (!isFilteredIn) return null;
                                            
                                            const result = testResults[m.name];
                                            let statusBadge = <span className="px-2 py-1 bg-slate-700 text-slate-300 rounded text-xs">Untested</span>;
                                            
                                            if (result) {
                                                if (result.status === 'passed') statusBadge = <span className="px-2 py-1 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 rounded text-xs">Passed</span>;
                                                else if (result.status === 'failed') statusBadge = <span className="px-2 py-1 bg-rose-500/20 text-rose-400 border border-rose-500/30 rounded text-xs" title={result.reason}>Failed</span>;
                                                else if (result.status === 'skipped') statusBadge = <span className="px-2 py-1 bg-amber-500/20 text-amber-400 border border-amber-500/30 rounded text-xs" title={result.reason}>Skipped</span>;
                                            }

                                            return (
                                                <tr key={m.name} className="hover:bg-slate-700/30 transition-colors">
                                                    <td className="p-3 font-medium text-slate-200">{m.name.replace('models/', '')}</td>
                                                    <td className="p-3">
                                                        <span className={`text-xs px-2 py-0.5 rounded-full ${m.type === 'text' ? 'bg-sky-500/20 text-sky-400' : m.type === 'image' ? 'bg-purple-500/20 text-purple-400' : 'bg-slate-500/20 text-slate-400'}`}>
                                                            {m.type}
                                                        </span>
                                                    </td>
                                                    <td className="p-3">{statusBadge}</td>
                                                </tr>
                                            );
                                        })}
                                    </tbody>
                                </table>
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
