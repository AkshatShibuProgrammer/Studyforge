<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Workspace - Inbuilt Gemini Integration</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* Markdown Styles */
        .markdown-body p { margin-bottom: 1em; line-height: 1.6; }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 { font-weight: 700; margin-top: 1.5em; margin-bottom: 0.75em; color: #1e293b; }
        .markdown-body h1 { font-size: 1.75em; }
        .markdown-body h2 { font-size: 1.5em; border-bottom: 1px solid #e2e8f0; padding-bottom: 0.3em; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5em; margin-bottom: 1.2em; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5em; margin-bottom: 1.2em; }
        .markdown-body li { margin-bottom: 0.5em; }
        .markdown-body strong { font-weight: 600; color: #0f172a; }
        .markdown-body blockquote { border-left: 4px solid #cbd5e1; padding-left: 1em; color: #475569; font-style: italic; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // SVG Icons
        const Icons = {
            Upload: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>,
            FileText: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>,
            Image: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect><circle cx="8.5" cy="8.5" r="1.5"></circle><polyline points="21 15 16 10 5 21"></polyline></svg>,
            Loader: ({ className }) => <svg className={`animate-spin ${className}`} xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="12" y1="2" x2="12" y2="6"></line><line x1="12" y1="18" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="7.76" y2="7.76"></line><line x1="16.24" y1="16.24" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="6" y2="12"></line><line x1="18" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="7.76" y2="16.24"></line><line x1="16.24" y1="7.76" x2="19.07" y2="4.93"></line></svg>,
            Download: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>,
            Trash: () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>,
            Search: () => <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        };

        // =========================================================================
        // GEMINI CANVAS DIRECT FETCH FUNCTIONS (ENVIRONMENT HACK)
        // =========================================================================
        
        /**
         * Function 1: Generate Text (Gemini 3 Flash)
         */
        const generateTextWithInbuiltGemini = async (base64PdfData, promptText) => {
            const apiKey = ""; // Canvas injects this automatically in runtime
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{
                    parts: [
                        { text: promptText },
                        { inlineData: { mimeType: "application/pdf", data: base64PdfData } }
                    ]
                }]
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error("Failed to analyze document.");
            
            const result = await response.json();
            return result?.candidates?.[0]?.content?.parts?.[0]?.text || "No analysis returned.";
        };

        /**
         * Function 2: Generate Image (Imagen)
         */
        const generateImageWithInbuiltGemini = async (imagePrompt) => {
            const apiKey = ""; // Canvas injects this automatically in runtime
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;

            const payload = {
                instances: [{ prompt: imagePrompt }],
                parameters: { sampleCount: 1, aspectRatio: "16:9" }
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error("Image generation failed.");

            const result = await response.json();
            const base64Encoded = result?.predictions?.[0]?.bytesBase64Encoded;
            return `data:image/png;base64,${base64Encoded}`;
        };

        /**
         * Function 3: Search the Web (Gemini 3 Flash with Grounding)
         */
        const searchWithInbuiltGemini = async (searchQuery) => {
            const apiKey = ""; // Canvas injects this automatically in runtime
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: `Search the web for: "${searchQuery}". Provide a concise, highly accurate, and structured summary of the results.` }] }],
                tools: [{ googleSearch: {} }]
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error("Search failed.");
            
            const result = await response.json();
            return result?.candidates?.[0]?.content?.parts?.[0]?.text || "No results.";
        };
        // =========================================================================


        // Basic Markdown parser component
        const MarkdownText = ({ text }) => {
            const renderHTML = (markdown) => {
                let html = markdown
                    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
                    .replace(/\*(.*?)\*/g, '<em>$1</em>')
                    .replace(/### (.*?)\n/g, '<h3>$1</h3>\n')
                    .replace(/## (.*?)\n/g, '<h2>$1</h2>\n')
                    .replace(/# (.*?)\n/g, '<h1>$1</h1>\n');

                const blocks = html.split('\n\n');
                return blocks.map(block => {
                    if (block.trim().startsWith('* ') || block.trim().startsWith('- ')) {
                        const listItems = block.split('\n')
                            .filter(line => line.trim().length > 0)
                            .map(line => `<li>${line.replace(/^[\*\-]\s+/, '')}</li>`)
                            .join('');
                        return `<ul>${listItems}</ul>`;
                    } else if (block.trim().match(/^\d+\./)) {
                        const listItems = block.split('\n')
                            .filter(line => line.trim().length > 0)
                            .map(line => `<li>${line.replace(/^\d+\.\s+/, '')}</li>`)
                            .join('');
                        return `<ol>${listItems}</ol>`;
                    } else if (!block.trim().startsWith('<h') && !block.trim().startsWith('<ul') && !block.trim().startsWith('<ol')) {
                        return `<p>${block}</p>`;
                    }
                    return block;
                }).join('');
            };

            return <div className="markdown-body" dangerouslySetInnerHTML={{ __html: renderHTML(text) }} />;
        };

        const App = () => {
            // States
            const [file, setFile] = useState(null);
            const [base64File, setBase64File] = useState('');
            const [isDragging, setIsDragging] = useState(false);
            
            const [status, setStatus] = useState('idle');
            const [errorMsg, setErrorMsg] = useState('');
            const [summary, setSummary] = useState('');
            const [mindmapUrl, setMindmapUrl] = useState('');

            const [searchQuery, setSearchQuery] = useState('');
            const [searchResults, setSearchResults] = useState('');
            const [isSearching, setIsSearching] = useState(false);

            const fileInputRef = useRef(null);

            const handleFile = (selectedFile) => {
                if (selectedFile && selectedFile.type === 'application/pdf') {
                    setFile(selectedFile);
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        const b64 = e.target.result.split(',')[1];
                        setBase64File(b64);
                    };
                    reader.readAsDataURL(selectedFile);
                } else {
                    alert("Please select a valid PDF file.");
                }
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    handleFile(e.dataTransfer.files[0]);
                }
            };

            const clearFile = () => {
                setFile(null);
                setBase64File('');
                setSummary('');
                setMindmapUrl('');
                setStatus('idle');
                if (fileInputRef.current) fileInputRef.current.value = '';
            };

            // Master Analyze Flow
            const analyzeAndGenerate = async () => {
                if (!base64File) return;
                
                try {
                    setStatus('analyzing');
                    setErrorMsg('');

                    // 1. TEXT GENERATION
                    const promptText = "You are an expert document analyzer. Provide a comprehensive summary, detailed key takeaways, and a structured breakdown of the main concepts. At the very end of your response, on a new line, write exactly 'IMAGE_PROMPT:' followed by a highly descriptive prompt to generate a visually striking mindmap.";
                    const fullText = await generateTextWithInbuiltGemini(base64File, promptText);

                    let displayText = fullText;
                    let imagePrompt = "A beautiful and detailed conceptual mindmap infographic.";

                    if (fullText.includes("IMAGE_PROMPT:")) {
                        const parts = fullText.split("IMAGE_PROMPT:");
                        displayText = parts[0].trim();
                        imagePrompt = parts[1].trim() + " Make it an infographic mindmap, clean design, highly visual.";
                    }

                    setSummary(displayText);

                    // 2. IMAGE GENERATION
                    setStatus('generating_image');
                    const imgUrl = await generateImageWithInbuiltGemini(imagePrompt);
                    setMindmapUrl(imgUrl);
                    
                    setStatus('success');

                } catch (err) {
                    console.error(err);
                    setErrorMsg(err.message || "An unknown error occurred.");
                    setStatus('error');
                }
            };

            // Search Flow
            const handleSearch = async () => {
                if (!searchQuery.trim()) return;
                try {
                    setIsSearching(true);
                    const results = await searchWithInbuiltGemini(searchQuery);
                    setSearchResults(results);
                } catch (err) {
                    console.error(err);
                    setSearchResults("Error executing search.");
                } finally {
                    setIsSearching(false);
                }
            };

            const downloadSummary = () => {
                const blob = new Blob([summary], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${file?.name?.replace('.pdf', '')}_summary.md`;
                a.click();
                URL.revokeObjectURL(url);
            };

            return (
                <div className="min-h-screen p-4 sm:p-6 lg:p-10 max-w-6xl mx-auto flex flex-col gap-8">
                    
                    {/* Header */}
                    <header className="text-center space-y-3 pt-6">
                        <div className="inline-flex p-3 bg-indigo-100 text-indigo-700 rounded-full mb-2">
                            <Icons.FileText />
                        </div>
                        <h1 className="text-3xl md:text-4xl font-extrabold tracking-tight">AI Workspace</h1>
                        <p className="text-gray-500 max-w-xl mx-auto text-lg">
                            Upload a document for deep analysis, generate mindmaps, and search the web using Gemini's native capabilities.
                        </p>
                    </header>

                    {/* Main Content Area */}
                    <main className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                        
                        {/* Left Column: Upload & Search */}
                        <div className="lg:col-span-4 space-y-6">
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                                <h2 className="text-xl font-bold mb-4 flex items-center gap-2">
                                    <Icons.Upload /> Upload Document
                                </h2>
                                
                                {!file ? (
                                    <div 
                                        onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                                        onDragLeave={() => setIsDragging(false)}
                                        onDrop={handleDrop}
                                        onClick={() => fileInputRef.current?.click()}
                                        className={`border-2 border-dashed rounded-xl p-8 text-center cursor-pointer transition-colors ${isDragging ? 'border-indigo-500 bg-indigo-50' : 'border-gray-300 hover:border-gray-400 hover:bg-gray-50'}`}
                                    >
                                        <div className="flex justify-center text-gray-400 mb-3"><Icons.Upload /></div>
                                        <p className="text-sm font-medium text-gray-700">Click or drag PDF here</p>
                                        <p className="text-xs text-gray-500 mt-1">Maximum 20MB</p>
                                        <input 
                                            type="file" 
                                            accept="application/pdf" 
                                            className="hidden" 
                                            ref={fileInputRef}
                                            onChange={(e) => handleFile(e.target.files[0])}
                                        />
                                    </div>
                                ) : (
                                    <div className="p-4 bg-gray-50 border border-gray-200 rounded-xl flex items-center justify-between">
                                        <div className="flex items-center gap-3 overflow-hidden">
                                            <div className="text-red-500"><Icons.FileText /></div>
                                            <div className="truncate">
                                                <p className="text-sm font-semibold text-gray-800 truncate">{file.name}</p>
                                                <p className="text-xs text-gray-500">{(file.size / 1024 / 1024).toFixed(2)} MB</p>
                                            </div>
                                        </div>
                                        <button onClick={clearFile} className="p-2 text-gray-400 hover:text-red-500 transition-colors" title="Remove file">
                                            <Icons.Trash />
                                        </button>
                                    </div>
                                )}

                                <div className="mt-6">
                                    <button
                                        onClick={analyzeAndGenerate}
                                        disabled={!file || status === 'analyzing' || status === 'generating_image'}
                                        className="w-full py-3.5 px-4 bg-slate-900 hover:bg-slate-800 text-white font-medium rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 shadow-sm"
                                    >
                                        {(status === 'analyzing' || status === 'generating_image') ? (
                                            <><Icons.Loader className="text-white" /> Processing...</>
                                        ) : (
                                            "Analyze & Generate"
                                        )}
                                    </button>
                                </div>
                                
                                {/* Status Steps */}
                                {status !== 'idle' && (
                                    <div className="mt-6 space-y-3">
                                        <div className="flex items-center gap-3">
                                            <div className={`w-2 h-2 rounded-full ${(status === 'analyzing' || status === 'generating_image' || status === 'success') ? 'bg-indigo-500' : 'bg-gray-300'}`}></div>
                                            <span className={`text-sm ${status === 'analyzing' ? 'font-semibold text-indigo-700 animate-pulse' : 'text-gray-600'}`}>Generating theory notes...</span>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <div className={`w-2 h-2 rounded-full ${(status === 'generating_image' || status === 'success') ? 'bg-indigo-500' : 'bg-gray-300'}`}></div>
                                            <span className={`text-sm ${status === 'generating_image' ? 'font-semibold text-indigo-700 animate-pulse' : 'text-gray-600'}`}>Drawing visual mindmap...</span>
                                        </div>
                                        {status === 'error' && (
                                            <div className="p-3 bg-red-50 text-red-700 text-sm rounded-lg mt-2 border border-red-100">
                                                {errorMsg}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>

                            {/* Web Search Box */}
                            <div className="bg-white p-6 rounded-2xl shadow-sm border border-gray-200">
                                <h2 className="text-xl font-bold mb-4 flex items-center gap-2">
                                    <Icons.Search /> Web Search
                                </h2>
                                <div className="flex gap-2 mb-4">
                                    <input 
                                        type="text" 
                                        value={searchQuery}
                                        onChange={(e) => setSearchQuery(e.target.value)}
                                        onKeyDown={(e) => e.key === 'Enter' && handleSearch()}
                                        placeholder="Ask the web..."
                                        className="flex-1 text-sm px-3 py-2.5 border border-gray-300 rounded-lg outline-none focus:ring-2 focus:ring-indigo-500 bg-gray-50"
                                    />
                                    <button 
                                        onClick={handleSearch}
                                        disabled={isSearching || !searchQuery.trim()}
                                        className="px-4 py-2 bg-indigo-600 hover:bg-indigo-700 text-white rounded-lg disabled:opacity-50 transition-colors"
                                    >
                                        {isSearching ? <Icons.Loader className="w-5 h-5" /> : "Search"}
                                    </button>
                                </div>
                                {searchResults && (
                                    <div className="p-4 bg-slate-50 border rounded-xl text-sm max-h-[300px] overflow-y-auto">
                                        <MarkdownText text={searchResults} />
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Right Column: Results */}
                        <div className="lg:col-span-8 space-y-6">
                            
                            {/* Mindmap Image */}
                            {(status === 'generating_image' || status === 'success') && (
                                <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden">
                                    <div className="px-6 py-4 border-b border-gray-100 bg-gray-50 flex items-center justify-between">
                                        <div className="flex items-center gap-2">
                                            <Icons.Image />
                                            <h3 className="font-semibold text-gray-800">Generated Asset</h3>
                                        </div>
                                        {status === 'success' && mindmapUrl && (
                                            <a href={mindmapUrl} download={`${file?.name?.replace('.pdf', '')}_mindmap.png`} className="text-sm flex items-center gap-1 text-indigo-600 hover:text-indigo-800 font-medium">
                                                <Icons.Download /> Save Image
                                            </a>
                                        )}
                                    </div>
                                    <div className="p-6 bg-gray-50 flex items-center justify-center min-h-[350px]">
                                        {status === 'generating_image' && (
                                            <div className="flex flex-col items-center gap-3 text-gray-500">
                                                <Icons.Loader className="w-8 h-8" />
                                                <span>Drawing visual...</span>
                                            </div>
                                        )}
                                        {status === 'success' && mindmapUrl && (
                                            <img src={mindmapUrl} alt="Generated Asset" className="w-full h-auto max-h-[500px] object-contain rounded-xl shadow-sm border border-gray-200" />
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* Text Summary */}
                            {(status === 'generating_image' || status === 'success' || summary) && (
                                <div className="bg-white rounded-2xl shadow-sm border border-gray-200 overflow-hidden flex flex-col max-h-[800px]">
                                    <div className="px-6 py-4 border-b border-gray-100 bg-gray-50 flex items-center justify-between sticky top-0 z-10">
                                        <div className="flex items-center gap-2">
                                            <Icons.FileText />
                                            <h3 className="font-semibold text-gray-800">Generated Notes</h3>
                                        </div>
                                        {summary && (
                                            <button onClick={downloadSummary} className="text-sm flex items-center gap-1 text-indigo-600 hover:text-indigo-800 font-medium">
                                                <Icons.Download /> Save Text
                                            </button>
                                        )}
                                    </div>
                                    <div className="p-6 overflow-y-auto flex-1">
                                        {summary ? (
                                            <MarkdownText text={summary} />
                                        ) : (
                                            <div className="h-full flex items-center justify-center text-gray-400">
                                                <span>Notes will appear here...</span>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}
                            
                            {status === 'idle' && (
                                <div className="h-full border-2 border-dashed border-gray-200 rounded-2xl flex flex-col items-center justify-center text-gray-400 min-h-[400px] bg-gray-50/50">
                                    <Icons.FileText />
                                    <p className="mt-4 text-sm font-medium">Upload a PDF and click Analyze to view results here.</p>
                                </div>
                            )}

                        </div>
                    </main>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
