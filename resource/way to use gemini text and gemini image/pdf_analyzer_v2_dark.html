<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI PDF Analyzer & Mindmap Generator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- PDF.js for client-side local text extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <!-- Marked.js for high-fidelity markdown rendering -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Google Fonts: Inter & Space Grotesk -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0b0f19;
            color: #f1f5f9;
        }
        
        .title-font {
            font-family: 'Space Grotesk', sans-serif;
        }
        
        /* Custom Elegant Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #64748b;
        }

        /* High contrast elegant markdown styling for darker interface */
        .markdown-body {
            color: #cbd5e1;
            font-size: 0.975rem;
            line-height: 1.7;
        }
        .markdown-body p {
            margin-bottom: 1.25rem;
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3 {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            color: #ffffff;
            margin-top: 1.75rem;
            margin-bottom: 0.85rem;
        }
        .markdown-body h1 { font-size: 1.6rem; border-bottom: 1px solid #1e293b; padding-bottom: 0.4rem; }
        .markdown-body h2 { font-size: 1.35rem; border-bottom: 1px solid #1e293b; padding-bottom: 0.3rem; }
        .markdown-body h3 { font-size: 1.15rem; }
        .markdown-body ul { list-style-type: disc; padding-left: 1.5rem; margin-bottom: 1.25rem; }
        .markdown-body ol { list-style-type: decimal; padding-left: 1.5rem; margin-bottom: 1.25rem; }
        .markdown-body li { margin-bottom: 0.5rem; }
        .markdown-body strong { font-weight: 600; color: #38bdf8; }
        .markdown-body blockquote {
            border-left: 4px solid #38bdf8;
            background-color: #0f172a;
            padding: 0.75rem 1rem;
            margin: 1rem 0;
            border-radius: 0 0.5rem 0.5rem 0;
            color: #94a3b8;
            font-style: italic;
        }
        .markdown-body code {
            background-color: #1e293b;
            padding: 0.2rem 0.4rem;
            border-radius: 0.25rem;
            font-family: monospace;
            font-size: 0.875rem;
            color: #f43f5e;
        }
        
        /* Shimmer effect for loaders */
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }
        .shimmer-bg {
            background: linear-gradient(90deg, #1e293b 25%, #334155 50%, #1e293b 75%);
            background-size: 200% 100%;
            animation: shimmer 1.5s infinite;
        }
    </style>
</head>
<body className="antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // Custom Inline SVG Icons for better styling control and look & feel
        const Icons = {
            Upload: () => (
                <svg className="w-8 h-8 text-sky-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" />
                </svg>
            ),
            FileText: () => (
                <svg className="w-6 h-6 text-sky-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
            ),
            Image: () => (
                <svg className="w-5 h-5 text-purple-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M4 16l4.586-4.586a1 1 0 011.414 0L16 17m0 0l1-1m-1 1k-3-3m-3 3L15 12m0 0l3-3m0 0h5M5 3a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2V5a2 2 0 00-2-2H5z" />
                </svg>
            ),
            Loader: ({ className }) => (
                <svg className={`animate-spin ${className}`} xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                    <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
            ),
            Download: () => (
                <svg className="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
            ),
            Trash: () => (
                <svg className="w-5 h-5" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-4v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                </svg>
            ),
            Refresh: () => (
                <svg className="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 1121.21 15.19M9 15.5l.004-.004" />
                </svg>
            ),
            Sparkles: () => (
                <svg className="w-5 h-5 text-amber-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M5 3v4M3 5h4M6 17v4m-2-2h4m5-16l2.286 6.857L21 12l-5.714 2.143L13 21l-2.286-6.857L5 12l5.714-2.143L13 3z" />
                </svg>
            ),
            Eye: () => (
                <svg className="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    <path strokeLinecap="round" strokeLinejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
                </svg>
            ),
            Copy: () => (
                <svg className="w-4 h-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <path strokeLinecap="round" strokeLinejoin="round" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3" />
                </svg>
            ),
            Search: () => (
                <svg className="w-5 h-5 text-indigo-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            )
        };

        /**
         * Function 1: Gemini 3 Flash Text Generation
         * Analyzes raw PDF content text and returns comprehensive markdown formatted summary
         */
        const generateTextFromPdf = async (documentText) => {
            const apiKey = ""; // Canvas injects this automatically in runtime
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const systemPrompt = `You are a world-class academic researcher and document synthesis agent.
Read the provided document text carefully. Output a premium-grade conceptual analysis.
Structure your output precisely in clean Markdown format with the following details:
1. Executive Summary
2. Core Technical Concepts or Arguments Explained
3. Key Takeaways & Deep Insights
4. Logical Node map outlining connections.

CRITICAL: At the very end of your response, on a final brand new line, you MUST write exactly:
IMAGE_PROMPT: [Insert a highly descriptive, word-free visual prompt describing an abstract, conceptual, stunning graphical mindmap diagram that visualizes these concepts. No text blocks in the generated image. Focus on visual lines, geometric icons, modern node diagrams, clean technology theme, dark background]

Ensure there is no extra text or explanations around the IMAGE_PROMPT line.`;

            const userQuery = `Here is the extracted document text to analyze:\n\n${documentText.substring(0, 16000)}`;

            const payload = {
                contents: [{ parts: [{ text: userQuery }] }],
                systemInstruction: {
                    parts: [{ text: systemPrompt }]
                }
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData?.error?.message || `Failed to analyze document. Server returned status code ${response.status}`);
            }

            const result = await response.json();
            const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) {
                throw new Error("No analysis returned from Gemini API.");
            }
            return text;
        };

        /**
         * Function 2: Imagen 4 Image Generation
         * Calls Imagen 4 model to generate beautiful, crisp mindmap graphics
         */
        const generateMindmapImage = async (imagePrompt, styleTheme) => {
            const apiKey = ""; // Canvas injects this automatically in runtime
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/imagen-4.0-generate-001:predict?key=${apiKey}`;

            let styleModifier = "";
            switch (styleTheme) {
                case 'cyberpunk':
                    styleModifier = "cyberpunk neon style, glowing nodes, digital flow connections, electric violet, neon blue, and vivid pink colors, cyber aesthetic, high-tech interface mockup, ultra detailed dark theme";
                    break;
                case 'minimalist':
                    styleModifier = "clean modern minimalist vector style, soft pastel palette on warm dark grey background, thin precise line weights, elegant flat design, professional UX design wireframe pattern";
                    break;
                case 'creative':
                    styleModifier = "artistic hand-drawn whiteboard style, schematic sketching, blueprints of thought connections, colorful creative visual scribbles, high resolution concept art";
                    break;
                case 'corporate':
                default:
                    styleModifier = "professional corporate network visualization, sophisticated tech enterprise visual theme, deep space blue and bright turquoise colors, sharp glowing connection nodes, vector graphic look, clean flat design";
            }

            // Clean-up and join the prompt to guide Imagen correctly
            const basePrompt = imagePrompt.replace(/['"]/g, '').trim();
            const refinedPrompt = `High quality tech infographic schematic representing a visual mindmap diagram of: ${basePrompt}. Style elements: ${styleModifier}. Crisp detailed nodes, glowing interconnected neural pathways, premium sleek modern design layout, zero misspelled words or messy overlapping text, elegant dark background, high resolution 4k render.`;

            const payload = {
                instances: [{ prompt: refinedPrompt }],
                parameters: {
                    sampleCount: 1,
                    aspectRatio: "16:9"
                }
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData?.error?.message || `Imagen server returned status code ${response.status}`);
            }

            const result = await response.json();
            const base64Encoded = result?.predictions?.[0]?.bytesBase64Encoded;
            if (!base64Encoded) {
                throw new Error("No image prediction bytes returned from Imagen API.");
            }

            return `data:image/png;base64,${base64Encoded}`;
        };

        /**
         * Function 3: Web Search using Gemini Grounding
         * Searches the web using Google Search grounding tool
         */
        const performWebSearch = async (searchQuery) => {
            const apiKey = ""; // Canvas injects this automatically in runtime
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;

            const payload = {
                contents: [{ parts: [{ text: `Search the web for: "${searchQuery}". Provide a concise, highly accurate, and structured summary of the results.` }] }],
                tools: [{ googleSearch: {} }]
            };

            const response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData?.error?.message || `Failed to search. Server returned status code ${response.status}`);
            }

            const result = await response.json();
            const text = result?.candidates?.[0]?.content?.parts?.[0]?.text;
            if (!text) {
                throw new Error("No search results returned from Gemini API.");
            }
            return text;
        };

        // Markdown parser component utilizing marked.js
        const MarkdownText = ({ text }) => {
            const getParsedHTML = () => {
                try {
                    // Pre-convert simple elements or rely fully on marked.js
                    return { __html: marked.parse(text) };
                } catch (e) {
                    return { __html: `<p className="text-red-400">Error parsing Markdown: ${e.message}</p>` };
                }
            };
            return <div className="markdown-body" dangerouslySetInnerHTML={getParsedHTML()} />;
        };

        const App = () => {
            const [file, setFile] = useState(null);
            const [extractedText, setExtractedText] = useState('');
            const [isDragging, setIsDragging] = useState(false);
            const [extractionProgress, setExtractionProgress] = useState(0);
            
            // App state machines
            const [status, setStatus] = useState('idle'); // idle, extracting, analyzing, generating_image, success, error
            const [errorMsg, setErrorMsg] = useState('');
            
            const [summary, setSummary] = useState('');
            const [mindmapUrl, setMindmapUrl] = useState('');
            const [mindmapPrompt, setMindmapPrompt] = useState('');
            const [styleTheme, setStyleTheme] = useState('corporate'); // corporate, cyberpunk, minimalist, creative
            const [activeTab, setActiveTab] = useState('summary'); // summary, raw
            
            // Interactive custom states
            const [showModal, setShowModal] = useState(false);
            const [isCopied, setIsCopied] = useState(false);
            const [isRegeneratingImage, setIsRegeneratingImage] = useState(false);
            const [userModifiedPrompt, setUserModifiedPrompt] = useState('');

            // Search feature states
            const [searchQuery, setSearchQuery] = useState('');
            const [searchResults, setSearchResults] = useState('');
            const [isSearching, setIsSearching] = useState(false);

            const fileInputRef = useRef(null);

            // Extract text from uploaded PDF locally using client side PDFJS
            const handleFile = async (selectedFile) => {
                if (selectedFile && selectedFile.type === 'application/pdf') {
                    setFile(selectedFile);
                    setStatus('idle');
                    setExtractedText('');
                    setExtractionProgress(0);
                    
                    try {
                        setStatus('extracting');
                        const arrayBuffer = await selectedFile.arrayBuffer();
                        const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                        
                        let text = "";
                        // Read up to the first 15 pages for comprehensive analysis
                        const maxPages = Math.min(pdf.numPages, 15);
                        
                        for (let i = 1; i <= maxPages; i++) {
                            const page = await pdf.getPage(i);
                            const textContent = await page.getTextContent();
                            const pageText = textContent.items.map(item => item.str).join(" ");
                            text += pageText + "\n";
                            setExtractionProgress(Math.round((i / maxPages) * 100));
                        }
                        
                        if (!text.trim()) {
                            throw new Error("This PDF seems to have no readable text. It might be a scanned document containing only images.");
                        }

                        setExtractedText(text);
                        setStatus('idle');
                    } catch (err) {
                        console.error("Error reading PDF:", err);
                        setErrorMsg(err.message || "Failed to parse the PDF file. Please ensure it is a valid, uncorrupted, text-based PDF.");
                        setStatus('error');
                        clearFile();
                    }
                } else {
                    alert("Please upload a valid PDF file.");
                }
            };

            const handleDrop = (e) => {
                e.preventDefault();
                setIsDragging(false);
                if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                    handleFile(e.dataTransfer.files[0]);
                }
            };

            const clearFile = () => {
                setFile(null);
                setExtractedText('');
                setSummary('');
                setMindmapUrl('');
                setMindmapPrompt('');
                setUserModifiedPrompt('');
                setStatus('idle');
                setExtractionProgress(0);
                if (fileInputRef.current) fileInputRef.current.value = '';
            };

            const analyzeAndGenerate = async () => {
                if (!extractedText) {
                    setErrorMsg("Please wait for the PDF text to finish extracting first.");
                    return;
                }
                
                try {
                    setStatus('analyzing');
                    setErrorMsg('');

                    // Step 1: Run deep conceptual analysis via gemini-3-flash-preview
                    const rawResponseText = await generateTextFromPdf(extractedText);

                    let mainSummaryText = rawResponseText;
                    let parsedPrompt = "An intricate web of technology conceptual links, abstract mindmap vector flow layout";

                    // Safely extract the generated image prompt block
                    if (rawResponseText.includes("IMAGE_PROMPT:")) {
                        const parts = rawResponseText.split("IMAGE_PROMPT:");
                        mainSummaryText = parts[0].trim();
                        parsedPrompt = parts[1].trim();
                    } else {
                        // Fallback search inside response if format deviates slightly
                        const lowerCaseText = rawResponseText.toLowerCase();
                        const promptIdx = lowerCaseText.lastIndexOf("image_prompt");
                        if (promptIdx !== -1) {
                            const subText = rawResponseText.substring(promptIdx);
                            const semiColonIdx = subText.indexOf(":");
                            if (semiColonIdx !== -1) {
                                parsedPrompt = subText.substring(semiColonIdx + 1).trim();
                                mainSummaryText = rawResponseText.substring(0, promptIdx).trim();
                            }
                        }
                    }

                    setSummary(mainSummaryText);
                    setMindmapPrompt(parsedPrompt);
                    setUserModifiedPrompt(parsedPrompt);

                    // Step 2: Trigger visual generation via Imagen 4 using chosen theme
                    setStatus('generating_image');
                    const imgUrl = await generateMindmapImage(parsedPrompt, styleTheme);
                    setMindmapUrl(imgUrl);
                    setStatus('success');

                } catch (err) {
                    console.error("AI Generation Error:", err);
                    setErrorMsg(err.message || "An expected error occurred during the AI operations. Please check your internet connectivity and try again.");
                    setStatus('error');
                }
            };

            const handleRegenerateMindmap = async () => {
                if (!userModifiedPrompt) return;
                try {
                    setIsRegeneratingImage(true);
                    setErrorMsg('');
                    const imgUrl = await generateMindmapImage(userModifiedPrompt, styleTheme);
                    setMindmapUrl(imgUrl);
                    setIsRegeneratingImage(false);
                } catch (err) {
                    console.error("Failed to regenerate mindmap:", err);
                    setErrorMsg("Mindmap regeneration failed: " + err.message);
                    setIsRegeneratingImage(false);
                }
            };

            // Search execution handler
            const handleSearch = async () => {
                if (!searchQuery.trim()) return;
                try {
                    setIsSearching(true);
                    const results = await performWebSearch(searchQuery);
                    setSearchResults(results);
                } catch (err) {
                    console.error("Search Error:", err);
                    setSearchResults(`Error: ${err.message || "Failed to execute web search."}`);
                } finally {
                    setIsSearching(false);
                }
            };

            // Download helper for generated markdown file
            const downloadSummary = () => {
                const blob = new Blob([summary], { type: 'text/markdown' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${file?.name?.replace('.pdf', '')}_summary_insights.md`;
                a.click();
                URL.revokeObjectURL(url);
            };

            // Clipboard copy helper
            const copySummaryToClipboard = () => {
                navigator.clipboard.writeText(summary);
                setIsCopied(true);
                setTimeout(() => setIsCopied(false), 2000);
            };

            return (
                <div className="min-h-screen p-4 sm:p-6 lg:p-10 max-w-7xl mx-auto flex flex-col gap-8">
                    
                    {/* Header bar and branding */}
                    <header className="flex flex-col md:flex-row items-center justify-between border-b border-slate-800 pb-6 gap-4">
                        <div className="flex items-center gap-3">
                            <div className="p-3 bg-sky-500/10 border border-sky-500/20 rounded-xl text-sky-400">
                                <svg className="w-8 h-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M11 3.055A9.003 9.003 0 1020.945 13H11V3.055z" />
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M20.488 9H15V3.512A9.025 9.025 0 0120.488 9z" />
                                </svg>
                            </div>
                            <div>
                                <h1 className="text-2xl md:text-3xl font-extrabold title-font tracking-tight bg-gradient-to-r from-white via-slate-100 to-sky-400 bg-clip-text text-transparent">
                                    GraphDoc AI
                                </h1>
                                <p className="text-xs md:text-sm text-slate-400 font-medium">
                                    Dynamic PDF Deep Synthesis & Mindmapping Workspace
                                </p>
                            </div>
                        </div>
                        <div className="flex items-center gap-2 px-3 py-1.5 bg-slate-900 border border-slate-800 rounded-full text-xs text-slate-300">
                            <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                            Gemini 3 Flash & Imagen 4 Enabled
                        </div>
                    </header>

                    {/* Main workspace container */}
                    <main className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                        
                        {/* Left Column Controls */}
                        <div className="lg:col-span-4 space-y-6">
                            
                            {/* Card: Upload Section */}
                            <div className="bg-slate-900/50 backdrop-blur-md p-6 rounded-2xl border border-slate-800 shadow-xl space-y-5">
                                <div className="flex items-center justify-between">
                                    <h2 className="text-lg font-bold title-font text-white flex items-center gap-2">
                                        <span className="text-sky-400">01.</span> Document Source
                                    </h2>
                                    {file && (
                                        <button 
                                            onClick={clearFile}
                                            className="text-xs text-rose-400 hover:text-rose-300 transition-colors flex items-center gap-1"
                                            title="Clear uploaded document"
                                        >
                                            <Icons.Trash /> Reset
                                        </button>
                                    )}
                                </div>
                                
                                {!file && status !== 'extracting' ? (
                                    <div 
                                        onDragOver={(e) => { e.preventDefault(); setIsDragging(true); }}
                                        onDragLeave={() => setIsDragging(false)}
                                        onDrop={handleDrop}
                                        onClick={() => fileInputRef.current?.click()}
                                        className={`border-2 border-dashed rounded-xl p-8 text-center cursor-pointer transition-all duration-200 ${
                                            isDragging 
                                            ? 'border-sky-500 bg-sky-500/5' 
                                            : 'border-slate-700 hover:border-slate-500 hover:bg-slate-800/40'
                                        }`}
                                    >
                                        <div className="flex justify-center text-slate-400 mb-3">
                                            <Icons.Upload />
                                        </div>
                                        <p className="text-sm font-semibold text-slate-200">Drag & Drop your PDF</p>
                                        <p className="text-xs text-slate-400 mt-1">or click to browse local files</p>
                                        <p className="text-[10px] text-slate-500 mt-3 uppercase tracking-wider font-semibold">Supports PDFs up to 15 pages</p>
                                        <input 
                                            type="file" 
                                            accept="application/pdf" 
                                            className="hidden" 
                                            ref={fileInputRef}
                                            onChange={(e) => handleFile(e.target.files[0])}
                                        />
                                    </div>
                                ) : status === 'extracting' ? (
                                    <div className="border border-slate-800 bg-slate-950/60 p-6 rounded-xl flex flex-col items-center justify-center text-center">
                                        <Icons.Loader className="w-8 h-8 text-sky-400 mb-3" />
                                        <p className="text-sm font-medium text-slate-300">Extracting PDF text locally...</p>
                                        <p className="text-xs text-slate-500 mt-1">Analyzing pages and preparing schema data</p>
                                        
                                        {/* Progressive progress bar */}
                                        <div className="w-full bg-slate-800 rounded-full h-2 mt-4 overflow-hidden">
                                            <div 
                                                className="bg-gradient-to-r from-sky-500 to-indigo-500 h-2 rounded-full transition-all duration-300"
                                                style={{ width: `${extractionProgress}%` }}
                                            ></div>
                                        </div>
                                        <span className="text-xs text-sky-400 font-bold mt-1.5">{extractionProgress}%</span>
                                    </div>
                                ) : (
                                    <div className="p-4 bg-slate-950/70 border border-slate-800 rounded-xl flex items-center justify-between">
                                        <div className="flex items-center gap-3 overflow-hidden">
                                            <div className="p-2 bg-red-500/10 border border-red-500/20 rounded-lg text-rose-500">
                                                <Icons.FileText />
                                            </div>
                                            <div className="truncate">
                                                <p className="text-sm font-bold text-slate-200 truncate">{file.name}</p>
                                                <p className="text-xs text-slate-400">{(file.size / 1024 / 1024).toFixed(2)} MB</p>
                                            </div>
                                        </div>
                                    </div>
                                )}
                            </div>

                            {/* Card: Mindmap Visual Customization Style Picker */}
                            <div className="bg-slate-900/50 backdrop-blur-md p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                                <h2 className="text-lg font-bold title-font text-white flex items-center gap-2">
                                    <span className="text-sky-400">02.</span> Mindmap Aesthetic
                                </h2>
                                <p className="text-xs text-slate-400">
                                    Choose the style archetype for the AI image output.
                                </p>
                                <div className="grid grid-cols-2 gap-2">
                                    {[
                                        { id: 'corporate', label: 'Corporate Modern', color: 'border-blue-500/30 text-blue-400 bg-blue-500/5' },
                                        { id: 'cyberpunk', label: 'Cyberpunk Neon', color: 'border-fuchsia-500/30 text-fuchsia-400 bg-fuchsia-500/5' },
                                        { id: 'minimalist', label: 'Minimalist UX', color: 'border-teal-500/30 text-teal-400 bg-teal-500/5' },
                                        { id: 'creative', label: 'Creative Sketch', color: 'border-amber-500/30 text-amber-400 bg-amber-500/5' }
                                    ].map((style) => (
                                        <button
                                            key={style.id}
                                            onClick={() => setStyleTheme(style.id)}
                                            className={`p-2.5 rounded-xl border text-xs font-semibold text-center transition-all ${
                                                styleTheme === style.id 
                                                ? 'border-sky-400 ring-2 ring-sky-500/20 text-white bg-slate-800' 
                                                : 'border-slate-800 hover:border-slate-700 text-slate-400 hover:text-slate-300'
                                            }`}
                                        >
                                            {style.label}
                                        </button>
                                    ))}
                                </div>
                            </div>

                            {/* Card: Action Button & Diagnostics */}
                            <div className="bg-slate-900/50 backdrop-blur-md p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                                <h2 className="text-lg font-bold title-font text-white flex items-center gap-2">
                                    <span className="text-sky-400">03.</span> AI Engine Actions
                                </h2>
                                
                                <button
                                    onClick={analyzeAndGenerate}
                                    disabled={!extractedText || status === 'analyzing' || status === 'generating_image'}
                                    className="w-full py-3.5 px-4 bg-gradient-to-r from-sky-500 to-indigo-600 hover:from-sky-400 hover:to-indigo-500 text-white font-bold rounded-xl transition-all disabled:opacity-40 disabled:cursor-not-allowed flex items-center justify-center gap-2 shadow-lg shadow-sky-500/15"
                                >
                                    {(status === 'analyzing' || status === 'generating_image') ? (
                                        <><Icons.Loader className="text-white w-5 h-5" /> Processing...</>
                                    ) : (
                                        <><Icons.Sparkles /> Analyze & Map</>
                                    )}
                                </button>

                                {/* Visual progress mapping steps */}
                                {status !== 'idle' && status !== 'extracting' && (
                                    <div className="p-3.5 bg-slate-950/80 rounded-xl border border-slate-800/80 space-y-3 mt-3">
                                        <div className="flex items-center gap-3">
                                            <div className={`w-2.5 h-2.5 rounded-full ${
                                                (status === 'analyzing' || status === 'generating_image' || status === 'success') 
                                                ? 'bg-sky-400 animate-pulse' 
                                                : 'bg-slate-700'
                                            }`}></div>
                                            <span className={`text-xs ${status === 'analyzing' ? 'font-bold text-sky-400' : 'text-slate-400'}`}>
                                                {status === 'analyzing' ? 'Gemini 3 Flash: Synthesizing Summary...' : 'Document parsed & organized'}
                                            </span>
                                        </div>
                                        <div className="flex items-center gap-3">
                                            <div className={`w-2.5 h-2.5 rounded-full ${
                                                (status === 'generating_image' || status === 'success') 
                                                ? 'bg-purple-400 animate-pulse' 
                                                : 'bg-slate-700'
                                            }`}></div>
                                            <span className={`text-xs ${status === 'generating_image' ? 'font-bold text-purple-400' : 'text-slate-400'}`}>
                                                {status === 'generating_image' ? 'Imagen 4: Painting Conceptual Mindmap...' : status === 'success' ? 'Mindmap generated' : 'Pending visual mapping'}
                                            </span>
                                        </div>

                                        {status === 'error' && (
                                            <div className="p-3 bg-rose-500/10 text-rose-400 text-xs rounded-lg border border-rose-500/20 mt-2">
                                                <p className="font-bold mb-1">Execution Interrupted:</p>
                                                {errorMsg}
                                            </div>
                                        )}
                                    </div>
                                )}
                            </div>

                            {/* Card: Web Search Workspace */}
                            <div className="bg-slate-900/50 backdrop-blur-md p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
                                <h2 className="text-lg font-bold title-font text-white flex items-center gap-2">
                                    <span className="text-indigo-400">04.</span> Deep Web Search
                                </h2>
                                <p className="text-xs text-slate-400">
                                    Query the web using Gemini's live search grounding tool.
                                </p>
                                <div className="space-y-3">
                                    <div className="relative">
                                        <div className="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                            <Icons.Search />
                                        </div>
                                        <input 
                                            type="text" 
                                            value={searchQuery}
                                            onChange={(e) => setSearchQuery(e.target.value)}
                                            onKeyDown={(e) => e.key === 'Enter' && handleSearch()}
                                            placeholder="Ask a question..."
                                            className="w-full pl-9 pr-3 py-2.5 bg-slate-950/50 border border-slate-700 rounded-xl text-sm text-slate-200 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 placeholder-slate-600 transition-all"
                                        />
                                    </div>
                                    <button 
                                        onClick={handleSearch}
                                        disabled={isSearching || !searchQuery.trim()}
                                        className="w-full py-2.5 px-4 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-slate-200 font-semibold text-sm rounded-xl transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2"
                                    >
                                        {isSearching ? <Icons.Loader className="w-4 h-4 text-indigo-400" /> : "Search Web"}
                                    </button>
                                </div>
                                {searchResults && (
                                    <div className="mt-4 p-4 bg-slate-950/60 border border-slate-800 rounded-xl max-h-[300px] overflow-y-auto">
                                        <MarkdownText text={searchResults} />
                                    </div>
                                )}
                            </div>

                        </div>

                        {/* Right Column: Display Canvas */}
                        <div className="lg:col-span-8 space-y-6">
                            
                            {/* Dynamic Workspaces tabs */}
                            <div className="bg-slate-900/40 p-1.5 rounded-xl border border-slate-800 flex items-center justify-between">
                                <div className="flex items-center gap-1.5">
                                    <button
                                        onClick={() => setActiveTab('summary')}
                                        className={`px-4 py-2 rounded-lg text-xs font-bold transition-all ${
                                            activeTab === 'summary' 
                                            ? 'bg-slate-800 text-white border border-slate-700' 
                                            : 'text-slate-400 hover:text-slate-200'
                                        }`}
                                    >
                                        AI Summary & Mindmap
                                    </button>
                                    <button
                                        onClick={() => setActiveTab('raw')}
                                        className={`px-4 py-2 rounded-lg text-xs font-bold transition-all ${
                                            activeTab === 'raw' 
                                            ? 'bg-slate-800 text-white border border-slate-700' 
                                            : 'text-slate-400 hover:text-slate-200'
                                        }`}
                                    >
                                        Raw Extracted PDF Content
                                    </button>
                                </div>
                            </div>

                            {/* Workspace 1: Active Document Analyzer Results */}
                            {activeTab === 'summary' && (
                                <div className="space-y-6">
                                    
                                    {/* Mindmap Image View container */}
                                    {(status === 'generating_image' || status === 'success' || mindmapUrl) && (
                                        <div className="bg-slate-900/50 rounded-2xl border border-slate-800 overflow-hidden shadow-xl">
                                            
                                            {/* Sub header controls */}
                                            <div className="px-6 py-4 border-b border-slate-800 bg-slate-950/40 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-3">
                                                <div className="flex items-center gap-2">
                                                    <div className="p-1.5 bg-purple-500/10 rounded-lg text-purple-400">
                                                        <Icons.Image />
                                                    </div>
                                                    <div>
                                                        <h3 className="font-bold text-slate-100 text-sm title-font">Generated Conceptual Blueprint</h3>
                                                        <p className="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Visual node synthesis of key concepts</p>
                                                    </div>
                                                </div>
                                                
                                                <div className="flex items-center gap-2 self-start sm:self-center">
                                                    {status === 'success' && mindmapUrl && (
                                                        <>
                                                            <button 
                                                                onClick={() => setShowModal(true)}
                                                                className="px-3 py-1.5 bg-slate-800 hover:bg-slate-700 rounded-lg text-xs font-semibold text-slate-200 hover:text-white flex items-center gap-1.5 border border-slate-700/60 transition-colors"
                                                            >
                                                                <Icons.Eye /> Inspect Fullscreen
                                                            </button>
                                                            <a 
                                                                href={mindmapUrl} 
                                                                download={`${file?.name?.replace('.pdf', '')}_mindmap_visualization.png`} 
                                                                className="px-3 py-1.5 bg-sky-500/10 hover:bg-sky-500/20 rounded-lg text-xs font-bold text-sky-400 flex items-center gap-1.5 border border-sky-500/20 transition-all"
                                                            >
                                                                <Icons.Download /> Export Asset
                                                            </a>
                                                        </>
                                                    )}
                                                </div>
                                            </div>

                                            {/* Visual canvas placeholder / renderer */}
                                            <div className="p-6 bg-slate-950/30 flex items-center justify-center min-h-[300px] relative">
                                                {status === 'generating_image' && (
                                                    <div className="flex flex-col items-center gap-3 text-slate-400">
                                                        <Icons.Loader className="w-10 h-10 text-purple-400 animate-spin" />
                                                        <span className="text-xs font-bold tracking-wider uppercase text-purple-300">Designing modern network nodes...</span>
                                                        <span className="text-[11px] text-slate-500">Executing complex image vector alignment via Imagen</span>
                                                    </div>
                                                )}
                                                {status === 'success' && mindmapUrl && (
                                                    <div className="w-full flex flex-col items-center gap-4">
                                                        <img 
                                                            src={mindmapUrl} 
                                                            alt="AI Conceptual Mindmap Visualization" 
                                                            className="w-full h-auto max-h-[420px] object-contain rounded-xl border border-slate-800 shadow-md cursor-pointer hover:border-slate-700 transition-all"
                                                            onClick={() => setShowModal(true)}
                                                        />
                                                    </div>
                                                )}
                                            </div>

                                            {/* Editable Prompt Block for customized image regeneration */}
                                            {status === 'success' && mindmapUrl && (
                                                <div className="px-6 py-4 bg-slate-950/60 border-t border-slate-800">
                                                    <details className="group">
                                                        <summary className="flex items-center justify-between cursor-pointer text-xs font-semibold text-slate-400 hover:text-slate-200">
                                                            <span>Customize Visual Prompt Settings</span>
                                                            <span className="transition group-open:rotate-180">
                                                                <svg className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7" />
                                                                </svg>
                                                            </span>
                                                        </summary>
                                                        <div className="mt-4 space-y-3">
                                                            <textarea
                                                                className="w-full p-3 bg-slate-900 border border-slate-700 rounded-lg text-xs text-slate-300 focus:outline-none focus:ring-1 focus:ring-sky-500 font-mono"
                                                                rows="3"
                                                                value={userModifiedPrompt}
                                                                onChange={(e) => setUserModifiedPrompt(e.target.value)}
                                                                placeholder="Tweak prompt details to rebuild image..."
                                                            />
                                                            <div className="flex justify-end">
                                                                <button
                                                                    onClick={handleRegenerateMindmap}
                                                                    disabled={isRegeneratingImage}
                                                                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-bold rounded-lg text-white flex items-center gap-1.5 transition-colors"
                                                                >
                                                                    {isRegeneratingImage ? (
                                                                        <><Icons.Loader className="w-3.5 h-3.5" /> Rebuilding...</>
                                                                    ) : (
                                                                        <><Icons.Refresh /> Regenerate Visual</>
                                                                    )}
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </details>
                                                </div>
                                            )}
                                        </div>
                                    )}

                                    {/* Summary Block */}
                                    {(status === 'generating_image' || status === 'success' || summary) && (
                                        <div className="bg-slate-900/50 rounded-2xl border border-slate-800 overflow-hidden shadow-xl flex flex-col">
                                            
                                            {/* Sub header controls */}
                                            <div className="px-6 py-4 border-b border-slate-800 bg-slate-950/40 flex items-center justify-between">
                                                <div className="flex items-center gap-2">
                                                    <div className="p-1.5 bg-sky-500/10 rounded-lg text-sky-400">
                                                        <Icons.FileText />
                                                    </div>
                                                    <div>
                                                        <h3 className="font-bold text-slate-100 text-sm title-font">Analytical Insights & Takeaways</h3>
                                                        <p className="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Gemini 3 Flash Structured Synthesis</p>
                                                    </div>
                                                </div>
                                                
                                                <div className="flex items-center gap-2">
                                                    {summary && (
                                                        <>
                                                            <button 
                                                                onClick={copySummaryToClipboard}
                                                                className="p-2 hover:bg-slate-800 text-slate-400 hover:text-slate-200 rounded-lg transition-colors text-xs flex items-center gap-1 font-bold"
                                                                title="Copy summary"
                                                            >
                                                                <Icons.Copy /> {isCopied ? 'Copied' : 'Copy'}
                                                            </button>
                                                            <button 
                                                                onClick={downloadSummary}
                                                                className="px-3 py-1.5 bg-slate-850 hover:bg-slate-800 rounded-lg text-xs font-bold text-sky-400 flex items-center gap-1 border border-slate-800 transition-colors"
                                                                title="Download summary"
                                                            >
                                                                <Icons.Download /> Save Markdown
                                                            </button>
                                                        </>
                                                    )}
                                                </div>
                                            </div>

                                            {/* Scrollable markdown viewport */}
                                            <div className="p-6 md:p-8 max-h-[700px] overflow-y-auto bg-slate-950/10">
                                                {summary ? (
                                                    <MarkdownText text={summary} />
                                                ) : (
                                                    <div className="flex flex-col items-center justify-center py-12 text-slate-500 gap-3">
                                                        <Icons.Loader className="w-8 h-8 text-sky-400 animate-spin" />
                                                        <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">Reading context metrics...</p>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    )}

                                    {/* Workspace Blank State */}
                                    {status === 'idle' && !summary && (
                                        <div className="border-2 border-dashed border-slate-800 bg-slate-900/10 rounded-2xl flex flex-col items-center justify-center text-slate-400 min-h-[450px]">
                                            <div className="p-4 bg-slate-900 rounded-full mb-4 border border-slate-800">
                                                <svg className="w-12 h-12 text-slate-600" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10" />
                                                </svg>
                                            </div>
                                            <p className="text-sm font-bold text-slate-300">Ready to Analyze</p>
                                            <p className="text-xs text-slate-500 mt-1 max-w-sm text-center">
                                                Choose or upload your research paper or corporate PDF document in step 1, select a mindmap theme, and click "Analyze & Map".
                                            </p>
                                        </div>
                                    )}

                                </div>
                            )}

                            {/* Workspace 2: Raw Extracted Text view tab */}
                            {activeTab === 'raw' && (
                                <div className="bg-slate-900/50 rounded-2xl border border-slate-800 overflow-hidden shadow-xl">
                                    <div className="px-6 py-4 border-b border-slate-800 bg-slate-950/40">
                                        <h3 className="font-bold text-slate-100 text-sm title-font">Extracted PDF Text Stream</h3>
                                        <p className="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Verify the source material being parsed locally</p>
                                    </div>
                                    <div className="p-6 bg-slate-950/40">
                                        {extractedText ? (
                                            <textarea
                                                readOnly
                                                className="w-full h-[550px] p-4 bg-slate-900 text-slate-300 font-mono text-xs rounded-xl focus:outline-none focus:ring-0 border border-slate-800"
                                                value={extractedText}
                                            />
                                        ) : (
                                            <div className="py-24 text-center text-slate-500 flex flex-col items-center justify-center gap-3">
                                                <Icons.FileText />
                                                <p className="text-xs">No PDF text extracted yet. Upload a document to inspect.</p>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                        </div>
                    </main>

                    {/* Fullscreen Image Modal */}
                    {showModal && mindmapUrl && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/95 backdrop-blur-sm transition-opacity">
                            <div className="relative max-w-6xl w-full bg-slate-900 rounded-3xl border border-slate-800 overflow-hidden shadow-2xl">
                                <div className="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-950/60">
                                    <h4 className="text-sm font-bold title-font text-white truncate">
                                        {file ? file.name : 'Document Mindmap'}
                                    </h4>
                                    <button 
                                        onClick={() => setShowModal(false)}
                                        className="p-1.5 hover:bg-slate-800 rounded-lg text-slate-400 hover:text-white transition-colors"
                                    >
                                        <svg className="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12" />
                                        </svg>
                                    </button>
                                </div>
                                <div className="p-6 flex items-center justify-center bg-slate-950/40 overflow-auto max-h-[80vh]">
                                    <img 
                                        src={mindmapUrl} 
                                        alt="Fullscreen conceptual representation" 
                                        className="max-w-full max-h-[70vh] object-contain rounded-xl shadow-lg"
                                    />
                                </div>
                                <div className="p-4 border-t border-slate-800 bg-slate-950/60 flex justify-between items-center text-xs text-slate-400">
                                    <span>High resolution mindmap layout</span>
                                    <a 
                                        href={mindmapUrl} 
                                        download={`${file?.name?.replace('.pdf', '')}_mindmap_visualization.png`} 
                                        className="px-4 py-2 bg-sky-600 hover:bg-sky-500 rounded-xl text-white font-bold transition-colors"
                                    >
                                        Download Image
                                    </a>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        };

        // Render main React entry-point
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
